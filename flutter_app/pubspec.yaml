name: ca_audit_platform
description: "AI-powered audit management platform for CA firms"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_storage: ^11.6.0
  
  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.1
  
  # Date & Time
  intl: ^0.19.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # File Handling
  file_picker: ^6.0.0
  
  # Charts
  fl_chart: ^0.63.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
