name: ca_audit_platform
description: "CA Audit Platform — Field Executive App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0

  # Networking
  dio: ^5.3.0

  # State Management
  provider: ^6.1.2

  # Camera & Media
  image_picker: ^1.1.2

  # Location
  geolocator: ^13.0.2

  # Permissions
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
